input {
  file {
    path => "/usr/share/logstash/data/uploads/*.json"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => "json"
    tags => ["json_import"]
  }
}

filter {
  if "json_import" in [tags] {
    date {
      match => ["timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss"]
      target => "@timestamp"
    }
  }
}

output {
  if "json_import" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "logs-json-%{+YYYY.MM.dd}"
    }
    stdout { codec => rubydebug }
  }
}
